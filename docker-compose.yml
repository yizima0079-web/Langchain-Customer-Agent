# 一键部署：MySQL 8 + 后端（FastAPI/LangChain）+ 前端（Nginx）
# 用法：
#   export OPENAL_APLKEY=sk-xxx        # 大模型密钥（或在根目录 .env 写 OPENAL_APLKEY=sk-xxx）
#   docker compose up -d --build
# 访问：前端 http://localhost/，后端文档 http://localhost:8000/docs
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-MySQL@123456}
      MYSQL_DATABASE: ${MYSQL_DB:-shop_agent}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动自动执行建表 + 种子数据脚本
      - ./server/sql:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./server
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-MySQL@123456}
      MYSQL_DB: ${MYSQL_DB:-shop_agent}
      UPLOAD_DIR: /app/uploads
      CHROMA_DIR: /app/uploads/chroma
      OPENAL_APLKEY: ${OPENAL_APLKEY:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-secret}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  uploads:
